name: validar plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validar el plugin
        run: claude plugin validate ./plugins/booked --strict
      - name: Validar el marketplace
        run: claude plugin validate . --strict
      - name: Las dos versiones coinciden
        run: |
          set -e
          plugin=$(node -p "require('./plugins/booked/.claude-plugin/plugin.json').version")
          market=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          test "$plugin" = "$market" || { echo "plugin.json dice $plugin y marketplace.json dice $market"; exit 1; }
