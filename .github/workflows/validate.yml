name: validar plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar versiones, conexiones y reglas compartidas
        run: python3 scripts/validate.py
      - name: Probar validación y empaquetado
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.278
      - name: Validar el plugin
        run: claude plugin validate ./plugins/booked --strict
      - name: Validar el marketplace
        run: claude plugin validate . --strict
      - name: Validar el paquete OAuth de Claude
        run: claude plugin validate ./plugins/booked-oauth --strict
